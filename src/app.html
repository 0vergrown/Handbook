<!doctype html>
<html lang="en" data-theme="light" data-theme-choice="system">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/assets/brand/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/assets/brand/favicon-192.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/assets/brand/apple-touch-icon.png" />
		<script>
			(function () {
				var choice = 'system';
				try {
					var stored = localStorage.getItem('handbook:theme');
					if (stored === 'light' || stored === 'dark') choice = stored;
				} catch (error) {}
				var dark =
					choice === 'dark' ||
					(choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme-choice', choice);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="handbook">%sveltekit.body%</div>
	</body>
</html>
